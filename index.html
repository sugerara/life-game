<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conway's Game of Life</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Conway's Game of Life</h1>
      <p class="app__hint">セルをクリック / ドラッグして初期状態を編集できます</p>
    </header>

    <canvas id="board" class="board"></canvas>

    <div class="controls">
      <button id="toggle-btn" type="button" class="btn btn--primary">再生</button>
      <button id="random-btn" type="button" class="btn">ランダム生成</button>
      <button id="clear-btn" type="button" class="btn">クリア</button>
    </div>

    <p class="status" id="status">世代: 0 / 生存セル: 0</p>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
